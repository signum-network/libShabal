name: Build

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86-64
            os: ubuntu-latest
            features: simd
            library: libshabal.so
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            features: neon
            library: libshabal.so
          - name: win32-x86-64
            os: windows-latest
            features: simd
            library: shabal.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --release --features ${{ matrix.features }}
      - name: Build
        run: cargo build --release --features ${{ matrix.features }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: target/release/${{ matrix.library }}

  # one universal library for Intel and Apple Silicon Macs
  build-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Test (arm64)
        run: cargo test --release --features neon
      - name: Build
        run: |
          cargo build --release --target aarch64-apple-darwin --features neon
          cargo build --release --target x86_64-apple-darwin --features simd
          mkdir -p dist
          lipo -create -output dist/libshabal.dylib \
            target/aarch64-apple-darwin/release/libshabal.dylib \
            target/x86_64-apple-darwin/release/libshabal.dylib
          lipo -info dist/libshabal.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: dist/libshabal.dylib

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, build-darwin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: natives
      - name: Package
        run: cd natives && zip -r ../libshabal-natives.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: libshabal-natives.zip
