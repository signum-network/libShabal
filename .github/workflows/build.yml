name: Build

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

jobs:
  # Built in manylinux_2_28 (glibc 2.28), so the libraries load on Debian 10+, Ubuntu 18.10+,
  # RHEL 8+ and Raspberry Pi OS buster+. Building on the runner itself would require its glibc.
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86-64
            os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
            features: simd
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            features: neon
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: CPU extensions
        run: grep -m1 -o -w -E 'sse2|avx|avx2|avx512f|asimd' /proc/cpuinfo | sort -u | tr '\n' ' ' || true
      - name: Test
        run: cargo test --release --features ${{ matrix.features }}
      - name: Build
        run: cargo build --release --features ${{ matrix.features }}
      # a shared library links with unresolved symbols, they only fail when Java loads it
      - name: No unresolved symbols
        run: |
          unresolved=$(nm -D --undefined-only target/release/libshabal.so | awk '$1 == "U" && $2 !~ /@/')
          if [ -n "$unresolved" ]; then echo "Unresolved symbols: $unresolved"; exit 1; fi
      - name: Requires at most glibc 2.28
        run: |
          newest=$(objdump -T target/release/libshabal.so | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1)
          echo "newest required: $newest"
          [ "$(printf '%s\nGLIBC_2.28\n' "$newest" | sort -V | tail -1)" = "GLIBC_2.28" ]
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: target/release/libshabal.so

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --release --features simd
      - name: Build
        run: cargo build --release --features simd
      - uses: actions/upload-artifact@v4
        with:
          name: win32-x86-64
          path: target/release/shabal.dll

  # one universal library for Intel and Apple Silicon Macs
  build-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Test (arm64)
        run: cargo test --release --features neon
      - name: Build
        run: |
          cargo build --release --target aarch64-apple-darwin --features neon
          cargo build --release --target x86_64-apple-darwin --features simd
          mkdir -p dist
          lipo -create -output dist/libshabal.dylib \
            target/aarch64-apple-darwin/release/libshabal.dylib \
            target/x86_64-apple-darwin/release/libshabal.dylib
          lipo -info dist/libshabal.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: dist/libshabal.dylib

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows, build-darwin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: natives
      - name: Package
        run: cd natives && zip -r ../libshabal-natives.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: libshabal-natives.zip
